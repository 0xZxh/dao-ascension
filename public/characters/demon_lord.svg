<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Cold Dark Nether-Sky & Stormy Cloud Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0714"/>
      <stop offset="45%" stop-color="#180f29"/>
      <stop offset="80%" stop-color="#221233"/>
      <stop offset="100%" stop-color="#0d0617"/>
    </linearGradient>
    <radialGradient id="crimsonMoon" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#7c1634" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#471342" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0b0714" stop-opacity="0"/>
    </radialGradient>
    <!-- Ink-Purple & Dark Gold Sovereign Robe Gradients -->
    <linearGradient id="robePurple" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2c1945"/>
      <stop offset="45%" stop-color="#1b0e2e"/>
      <stop offset="85%" stop-color="#11081f"/>
      <stop offset="100%" stop-color="#080311"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d98e"/>
      <stop offset="50%" stop-color="#c99b42"/>
      <stop offset="100%" stop-color="#6e4b16"/>
    </linearGradient>
    <!-- Blood-Crimson Flowing Silk Mantle (血色流光纱) -->
    <linearGradient id="bloodSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e32249" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#9e0e2c" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#420413" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="paleSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f2f6"/>
      <stop offset="70%" stop-color="#e9dfe8"/>
      <stop offset="100%" stop-color="#d2c3d1"/>
    </linearGradient>
    <linearGradient id="netherFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#591bc2" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#a838ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f0b8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="netherGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- 1. Cold Dark Atmosphere & Swirling Black Clouds (黑云缭绕，冷暗氛围感) -->
  <rect width="800" height="1000" fill="url(#darkBg)"/>
  <circle cx="400" cy="260" r="400" fill="url(#crimsonMoon)"/>

  <!-- Blood-Moon Halo Behind Sovereign -->
  <circle cx="400" cy="240" r="155" fill="none" stroke="#c92a4d" stroke-width="2" opacity="0.42" filter="url(#netherGlow)"/>
  <circle cx="400" cy="240" r="135" fill="#3a0a24" opacity="0.35"/>

  <!-- Billowing Dark Clouds in Background -->
  <g fill="#08040f" opacity="0.72" filter="url(#cloudBlur)">
    <ellipse cx="140" cy="180" rx="220" ry="75"/>
    <ellipse cx="670" cy="210" rx="240" ry="85"/>
    <ellipse cx="120" cy="760" rx="260" ry="110"/>
    <ellipse cx="680" cy="790" rx="260" ry="110"/>
  </g>

  <!-- 2. Swirling Blood-Silk Streamers (血色流光纱) -->
  <g filter="url(#netherGlow)">
    <path d="M295,340 C150,280 65,410 115,565 C155,685 75,785 45,875 C125,830 215,725 185,575 C155,435 225,365 315,380 Z" fill="url(#bloodSilk)"/>
    <path d="M505,340 C650,280 735,410 685,565 C645,685 725,785 755,875 C675,830 585,725 615,575 C645,435 575,365 485,380 Z" fill="url(#bloodSilk)"/>
  </g>

  <!-- 3. Wind-Tousled Obsidian Long Hair (黑发微乱) -->
  <g fill="#0c0814" stroke="#261938" stroke-width="1.2">
    <path d="M335,190 C245,270 185,435 135,620 C215,560 265,465 305,355 C275,475 245,595 225,710 C285,625 325,515 350,395 Z"/>
    <path d="M465,190 C555,270 615,435 665,620 C585,560 535,465 495,355 C525,475 555,595 575,710 C515,625 475,515 450,395 Z"/>
  </g>

  <!-- 4. Billowing Ink-Purple & Dark Gold Sovereign Robes (墨紫暗金长袍，暗纹魔纹，衣袂狂扬) -->
  <g>
    <!-- Wide Sweeping Outer Cape/Sleeves -->
    <path d="M310,320 C205,395 130,545 90,735 C185,705 255,635 310,525 L265,915 L395,885 L405,885 L535,915 L490,525 C545,635 615,705 710,735 C670,545 595,395 490,320 Z" fill="url(#robePurple)" stroke="url(#darkGold)" stroke-width="2.2"/>

    <!-- Inner Layered Sovereign Long Robe -->
    <path d="M335,315 L400,435 L465,315 L515,935 L285,935 Z" fill="#140a24" stroke="url(#darkGold)" stroke-width="2"/>

    <!-- Glowing Demonic Gold & Crimson Runes on Robe Hem (暗纹魔纹) -->
    <g fill="none" stroke="url(#darkGold)" stroke-width="1.8" opacity="0.82">
      <path d="M330,620 L355,655 L330,690 L355,725 L325,765"/>
      <path d="M470,620 L445,655 L470,690 L445,725 L475,765"/>
      <path d="M400,520 L400,860" stroke-width="2.4"/>
      <polygon points="400,565 422,605 400,645 378,605"/>
      <polygon points="400,695 428,745 400,795 372,745"/>
    </g>
    <!-- Crimson Demonic Array Sigils on Sleeves -->
    <g fill="none" stroke="#d9264e" stroke-width="1.5" opacity="0.65" filter="url(#netherGlow)">
      <circle cx="220" cy="575" r="28"/>
      <polygon points="220,550 242,588 198,588"/>
      <circle cx="580" cy="575" r="28"/>
      <polygon points="580,550 602,588 558,588"/>
    </g>

    <!-- Sovereign Shoulder Armor & Deep V-Collar -->
    <path d="M285,325 C315,295 350,295 370,315 L400,398 L430,315 C450,295 485,295 515,325 L485,375 L400,425 L315,375 Z" fill="#23123b" stroke="url(#darkGold)" stroke-width="2.5"/>

    <!-- Black Jade Waist Belt & Pendant Ornaments (黑色玉饰) -->
    <path d="M332,465 Q400,488 468,465 L472,495 Q400,518 328,495 Z" fill="#0d0814" stroke="url(#darkGold)" stroke-width="2.5"/>
    <!-- Black Jade Medallion Centerpiece -->
    <polygon points="400,462 422,482 400,508 378,482" fill="#120d1c" stroke="url(#darkGold)" stroke-width="2.2"/>
    <circle cx="400" cy="484" r="5" fill="#d91e47" filter="url(#netherGlow)"/>
    <!-- Hanging Black Jade Pendants -->
    <line x1="365" y1="498" x2="355" y2="595" stroke="url(#darkGold)" stroke-width="1.8"/>
    <polygon points="355,595 364,612 355,629 346,612" fill="#0e0a17" stroke="url(#darkGold)" stroke-width="1.5"/>
    <line x1="435" y1="498" x2="445" y2="595" stroke="url(#darkGold)" stroke-width="1.8"/>
    <polygon points="445,595 454,612 445,629 436,612" fill="#0e0a17" stroke="url(#darkGold)" stroke-width="1.5"/>

    <!-- Right Hand Raised Summoning Dark-Violet Netherfire -->
    <path d="M510,435 C538,415 562,385 575,355" fill="none" stroke="url(#paleSkin)" stroke-width="14" stroke-linecap="round"/>
    <!-- Netherfire Vortex in Hand (暗紫色幽火) -->
    <path d="M575,355 C550,315 565,260 590,220 C595,265 620,285 612,335 C605,360 588,365 575,355 Z" fill="url(#netherFlame)" filter="url(#netherGlow)"/>
    <circle cx="588" cy="325" r="12" fill="#e69eff" opacity="0.85" filter="url(#netherGlow)"/>
  </g>

  <!-- 5. Aristocratic Handsome Face, Narrow Phoenix Eyes & Glowing Crimson Pupils (俊美邪魅，狭长凤眼，红瞳) -->
  <g>
    <!-- Neck & Exposed Upper Chest Collarbone -->
    <path d="M380,285 L372,355 L400,395 L428,355 L420,285 Z" fill="url(#paleSkin)"/>
    <path d="M390,335 L400,375 L410,335" fill="none" stroke="#cbb8ca" stroke-width="1.5"/>

    <!-- Sharp Chiseled Aristocratic Face -->
    <path d="M352,202 C352,162 372,142 400,142 C428,142 448,162 448,202 C446,248 422,288 400,298 C378,288 354,248 352,202 Z" fill="url(#paleSkin)" stroke="#cbb8ca" stroke-width="1.2"/>

    <!-- Narrow Slanted Phoenix Eyes with Crimson Pupils (狭长凤眼，红瞳) -->
    <!-- Left Eye -->
    <path d="M360,216 Q375,210 390,219 Q375,224 360,216 Z" fill="#ffffff"/>
    <circle cx="376" cy="217" r="5.2" fill="#d91438" filter="url(#netherGlow)"/>
    <circle cx="376" cy="217" r="2.2" fill="#3b000b"/>
    <circle cx="378" cy="215" r="1.5" fill="#ffd6de"/>
    <path d="M355,214 Q374,208 392,219" fill="none" stroke="#160b21" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M355,214 L346,207" fill="none" stroke="#8f1630" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <path d="M410,219 Q425,210 440,216 Q425,224 410,219 Z" fill="#ffffff"/>
    <circle cx="424" cy="217" r="5.2" fill="#d91438" filter="url(#netherGlow)"/>
    <circle cx="424" cy="217" r="2.2" fill="#3b000b"/>
    <circle cx="426" cy="215" r="1.5" fill="#ffd6de"/>
    <path d="M408,219 Q426,208 445,214" fill="none" stroke="#160b21" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M445,214 L454,207" fill="none" stroke="#8f1630" stroke-width="2" stroke-linecap="round"/>

    <!-- Sharp Sword Eyebrows -->
    <path d="M356,202 L391,209" stroke="#1a0f26" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M444,202 L409,209" stroke="#1a0f26" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Glowing Crimson Demon Crest on Forehead -->
    <path d="M400,174 L405,190 L400,202 L395,190 Z" fill="#d91438" filter="url(#netherGlow)"/>
    <path d="M392,184 Q400,194 408,184" fill="none" stroke="#f5d98e" stroke-width="1.3"/>

    <!-- Nose & Enigmatic Half-Smirk (邪魅浅笑) -->
    <path d="M400,224 L398,248 L403,250" fill="none" stroke="#bfa8be" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M388,268 Q400,272 414,264" fill="none" stroke="#853b52" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Tousled Front Hair Strands Falling Across Forehead & Cheeks (黑发微乱) -->
    <path d="M348,195 C345,150 372,130 400,130 C428,130 455,150 452,195 C440,165 418,155 400,162 C388,185 382,205 376,222 C378,195 382,175 390,160 C370,162 356,175 348,195 Z" fill="#0d0814"/>
    <path d="M350,180 C335,235 332,315 342,405 C350,335 354,265 360,210 Z" fill="#0d0814"/>
    <path d="M450,180 C465,235 468,315 458,405 C450,335 446,265 440,210 Z" fill="#0d0814"/>

    <!-- Black Jade & Dark Gold Demon Crown (墨玉暗金魔冠) -->
    <polygon points="372,135 400,92 428,135 415,142 385,142" fill="#120b1d" stroke="url(#darkGold)" stroke-width="2.2"/>
    <polygon points="400,104 407,122 400,134 393,122" fill="#d91438" filter="url(#netherGlow)"/>
  </g>

  <!-- 6. Floating Dark-Violet Netherfire Particles (周身暗紫色幽火粒子) -->
  <g filter="url(#netherGlow)">
    <!-- Flame Wisps -->
    <path d="M185,680 Q175,645 192,620 Q202,650 185,680 Z" fill="url(#netherFlame)"/>
    <path d="M625,650 Q635,615 618,590 Q608,620 625,650 Z" fill="url(#netherFlame)"/>
    <path d="M245,420 Q235,390 250,368 Q260,395 245,420 Z" fill="url(#netherFlame)"/>
    <path d="M280,820 Q270,785 288,755 Q298,790 280,820 Z" fill="url(#netherFlame)"/>
    <path d="M530,810 Q540,775 522,745 Q512,780 530,810 Z" fill="url(#netherFlame)"/>
    <!-- Glowing Particles -->
    <circle cx="165" cy="485" r="4.5" fill="#d38aff"/>
    <circle cx="225" cy="310" r="3.5" fill="#ff4d79"/>
    <circle cx="565" cy="245" r="4" fill="#d38aff"/>
    <circle cx="645" cy="495" r="5" fill="#b84dff"/>
    <circle cx="315" cy="695" r="3.5" fill="#ff4d79"/>
    <circle cx="485" cy="675" r="4" fill="#d38aff"/>
    <circle cx="195" cy="835" r="5" fill="#b84dff"/>
    <circle cx="605" cy="845" r="4.5" fill="#ff4d79"/>
  </g>
</svg>
